services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - knittrack

  php:
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    build:
      context: ./docker/php
      args:
        PHP_VERSION: "8.4"
    volumes:
      - ./:/var/www/html:cached
      - composer_cache:/tmp/composer-cache
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-change_me_in_prod}
      COMPOSER_HOME: /tmp/composer-home
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DATABASE_URL: postgresql://knittrack:knittrack@postgres:5432/knittrack?serverVersion=16
      MESSENGER_TRANSPORT_DSN: enqueue://kafka/knittrack.events
      MESSENGER_OUTBOX_DSN: doctrine://default
      REDIS_URL: redis://redis:6379
      MAILER_DSN: smtp://mailpit:1025
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET: knittrack-backups
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - knittrack

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knittrack
      POSTGRES_USER: knittrack
      POSTGRES_PASSWORD: knittrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knittrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - knittrack

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - knittrack

  kafka:  
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      - --advertise-kafka-addr PLAINTEXT://kafka:9092,OUTSIDE://localhost:9094
    ports: ["9092:9092", "9094:9094"]
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [knittrack]

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - knittrack

  localstack:
    profiles: ["storage"]
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstackdata:/var/lib/localstack
    networks:
      - knittrack

volumes:
  redpandadata:
  pgdata:
  redisdata:
  kafkadata:
  localstackdata:
  composer_cache:

networks:
  knittrack:
    driver: bridge
